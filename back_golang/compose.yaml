# Local stack: the API against a throwaway Mongo.
#
#   docker compose up --build
#
# Secrets come from .env, which is gitignored. Without PEY_API_KEY the API
# still boots and /health says so, which is enough to exercise everything
# except an actual charge.
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017
      DATABASE_NAME: divieat
      PEY_API_KEY: ${PEY_API_KEY:-}
      PEY_WEBHOOK_SECRET: ${PEY_WEBHOOK_SECRET:-}
      PEY_BANK_ACCOUNT_ID: ${PEY_BANK_ACCOUNT_ID:-}
      PEY_QR_EXPIRATION_SECONDS: "900"
      # Pey has no sandbox: without this brake a typo charges real money.
      PEY_TEST_MODE: "true"
      PEY_TEST_MAX_AMOUNT_MXN: "1"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    # --quiet drops the per-connection chatter. Without it the health probe
    # alone buries the API's own logs, which is exactly what you need to read
    # when something goes wrong in front of people.
    command: ["mongod", "--quiet"]
    # No volume on purpose: this data is disposable, and a stale local
    # database is a worse problem than an empty one.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      # Fast while starting, rare afterwards: the probe is there to gate
      # startup, not to poll a healthy database forever.
      start_period: 20s
      start_interval: 2s
      interval: 60s
      timeout: 5s
      retries: 3
