[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kicho", email = "kicho@servidoreselruso.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pymongo[srv]>=4.20.1",
    "standardwebhooks>=1.3.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# `app.py` y `database.py` viven en la raiz, no en src/.
pythonpath = ["."]
testpaths = ["tests"]
